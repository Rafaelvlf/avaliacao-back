spring.application.name=tarefa

# ---------- Banco de dados (PostgreSQL) ----------
# Valores vem de variaveis de ambiente (passadas no docker run do deploy.yml).
# Depois do ":" esta o valor padrao, usado quando voce roda local.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auladb}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Faz a mensagem do ResponseStatusException aparecer no JSON de erro
# (ex.: "A nota deve estar entre 0 e 10"), o front mostra essa mensagem.
server.error.include-message=always

# ---------- Auth0 ----------
# TROCAR pelos dados da SUA conta Auth0 (ver guia).
# issuer-uri: https://{domain}/   (com a barra no final)
# audience:   o "API Audience" (Applications -> APIs)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-5hln6oazovanzovo.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audience=https://dev-5hln6oazovanzovo.us.auth0.com/api/v2/
